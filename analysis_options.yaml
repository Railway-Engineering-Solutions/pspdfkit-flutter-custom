include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/src/api/nutrient_api.g.dart
    # Legacy dart:js-based web instance — only used on web where dart:js works.
    # Analyzer errors on non-web platforms are expected and harmless.
    - lib/src/web/nutrient_web_instance.dart
  #    - ../../core/Vendor
  errors:
    invalid_assignment: error
    missing_return: error
    dead_code: warning

linter:
  rules:
    - always_declare_return_types
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_full_hex_values_for_flutter_colors
